x-airflow-common: &airflow-common
  build:
      context: .
      dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY}"
    PYTHONPATH: "/opt/airflow"
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

  volumes:
    - ./shared:/opt/airflow/shared
    - ./db:/opt/airflow/db
    - ./dashboard:/opt/airflow/dashboard
    - ./domains:/opt/airflow/dags/domains
    - ./scheduler/logs:/opt/airflow/logs
    - ./scheduler/plugins:/opt/airflow/plugins
    - ./scheduler/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    db:
      condition: service_healthy


services:
  # 服務 A：程式碼執行環境 (VS Code 會連進這裡)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # 將本機的專案目錄，照鏡子般同步掛載到 Docker 內部的同名全小寫資料夾
      - .:/nkr202_dramaradar:cached
    # 保持容器在背景運作不退出
    command: sleep infinity
    env_file:
      - .env
    environment:
      # 設定資料庫連線字串，讓 Python 程式碼可以直接連到隔壁的 db 容器
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

  # 服務 B：本地的 PostgreSQL 資料庫
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # 建立一個虛擬硬碟，確保資料庫重啟時，爬蟲進去的資料不會不見
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # 新增健康檢查 確定啟動可連線後才airflowinit
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 15s
      retries: 10
  
  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER:-airflow}
      --password ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@xx.com"
      
volumes:
  postgres_data:

